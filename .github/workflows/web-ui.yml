name: Phase 1 local Web UI

on:
  pull_request:
    paths:
      - "src/tachie_motion/web/**"
      - "frontend/**"
      - "tests/test_web_api.py"
      - "tests/test_native_picker.py"
      - "pyproject.toml"
      - ".github/workflows/web-ui.yml"
  workflow_dispatch:

jobs:
  api-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install media and Python test dependencies
        run: |
          # GitHub-hosted runners may provide slow EC2/Azure mirrors.
          # The previous Azure-only exclusion still allowed EC2 APT stalls.
          # Pin the official Ubuntu mirror observed in the passing CI run.
          # Keep installing and exercising real FFmpeg; no test bypass.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            test "$(cat /etc/apt/apt-mirrors.txt)" = 'https://archive.ubuntu.com/ubuntu/'
            timeout 180s sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=1 update
            timeout 600s sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::Retries=1 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
          python -m pip install -e ".[web-test]"
      - name: API and real FFmpeg synthetic PSD tests
        run: python -m unittest discover -s tests -p "test_web_api.py" -v
      - name: Finder picker security tests (missing dependencies must fail)
        run: python -m unittest discover -s tests -p "test_native_picker.py" -v
      - name: Install frontend and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install chromium
      - name: Browser smoke tests
        working-directory: frontend
        run: npm run test:e2e
